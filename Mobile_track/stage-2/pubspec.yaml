name: expense_tracker
description: Personal finance tracker with facial liveness verification
publish_to: 'none'

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.6
  intl: ^0.19.0
  flutter_bloc: ^8.1.4
  equatable: ^2.0.5
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  facial_liveness_verification: ^2.1.0
  camera: ^0.11.0
  fl_chart: ^0.68.0
  schedules: ^1.0.0
  csv: ^6.0.0
  path_provider: ^2.1.2
  share_plus: ^8.0.0
  permission_handler: ^12.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  build_runner: ^2.4.9
  hive_generator: ^2.0.1
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true