<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Todo Card · Stage 1a · Complete Test IDs</title>
  <style>
    :root {
      --bg: #f6f7fb;
      --card: #ffffff;
      --primary: #4f46e5;
      --high: #ef4444;
      --medium: #f59e0b;
      --low: #10b981;
      --text: #111827;
      --muted: #6b7280;
    }
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Inter, system-ui, sans-serif;
    }
    body {
      background: var(--bg);
      display: flex;
      justify-content: center;
      align-items: flex-start;
      min-height: 100vh;
      padding: 20px;
    }
    .todo-card {
      background: var(--card);
      width: 100%;
      max-width: 540px;
      padding: 24px;
      border-radius: 20px;
      box-shadow: 0 12px 30px rgba(0,0,0,0.05);
    }
    /* checkbox row */
    .checkbox-row {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 18px;
    }
    .todo-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 12px;
    }
    .todo-title {
      font-size: 1.3rem;
      font-weight: 650;
    }
    .badge {
      padding: 5px 12px;
      border-radius: 30px;
      font-size: 0.75rem;
      font-weight: 700;
      color: white;
      text-transform: uppercase;
    }
    .priority-high { background: var(--high); }
    .priority-medium { background: var(--medium); }
    .priority-low { background: var(--low); }
    .status {
      display: inline-block;
      font-size: 0.85rem;
      font-weight: 600;
      background: #e0e7ff;
      color: var(--primary);
      padding: 4px 12px;
      border-radius: 30px;
      margin: 12px 0 8px;
    }
    .tags {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      list-style: none;
      margin: 10px 0;
    }
    .tag {
      background: #eef2ff;
      padding: 5px 12px;
      border-radius: 30px;
      font-size: 0.75rem;
    }
    time {
      font-size: 0.8rem;
      color: var(--muted);
      display: block;
    }
    .actions {
      display: flex;
      gap: 12px;
      margin-top: 20px;
    }
    button {
      border: none;
      padding: 8px 16px;
      border-radius: 40px;
      font-weight: 600;
      cursor: pointer;
      background: white;
      border: 1px solid #e2e8f0;
    }
    .edit-btn { background: #e0e7ff; }
    .delete-btn { background: #fee2e2; }
    .save-btn { background: var(--primary); color: white; }
    .cancel-btn { background: #f3f4f6; }
    .hidden { display: none !important; }
    .edit-form {
      margin: 16px 0;
      padding: 16px;
      background: #fafbff;
      border-radius: 16px;
    }
    .form-group {
      margin-bottom: 14px;
    }
    .form-group label {
      font-size: 0.8rem;
      font-weight: 600;
      display: block;
      margin-bottom: 6px;
    }
    .form-group input,
    .form-group select,
    .form-group textarea {
      width: 100%;
      padding: 10px;
      border: 1px solid #ddd;
      border-radius: 12px;
    }
    .collapsible-section {
      margin-top: 16px;
      padding: 12px;
      background: #f9f9fc;
      border-radius: 12px;
    }
    .expand-toggle {
      background: transparent;
      border: none;
      color: var(--primary);
      font-weight: 600;
      padding: 4px 0;
      margin: 8px 0;
    }
    .overdue-indicator {
      color: var(--high);
      font-weight: 600;
      font-size: 0.8rem;
      margin-left: 8px;
    }
    .strike { text-decoration: line-through; opacity: 0.7; }
  </style>
</head>
<body>

<article class="todo-card" data-testid="test-todo-card">
  <!-- Status control (checkbox) -->
  <div class="checkbox-row">
    <input type="checkbox" id="complete" data-testid="test-todo-status-control" />
    <label for="complete">Mark as done</label>
  </div>

  <!-- View mode -->
  <div id="viewMode">
    <div class="todo-header">
      <h3 class="todo-title" data-testid="test-todo-title">Finish Mobile Stage 0 UI</h3>
      <span class="badge priority-high" data-testid="test-todo-priority-indicator">High</span>
    </div>

    <p class="todo-description" data-testid="test-todo-description">
      Build accessible, responsive Todo Card component for Stage 0 evaluation.
    </p>

    <time datetime="2026-03-01T18:00:00Z" data-testid="test-todo-due-date">Due March 1, 2026 6:00 PM</time>
    <div>
      <span data-testid="test-todo-time-remaining" id="timeRemaining">Calculating...</span>
      <span data-testid="test-todo-overdue-indicator" id="overdueIndicator" class="overdue-indicator hidden">Overdue</span>
    </div>

    <span class="status" data-testid="test-todo-status">Pending</span>

    <ul class="tags" data-testid="test-todo-tags" id="tagsList">
      <li class="tag" data-testid="test-todo-tag-work">work</li>
      <li class="tag" data-testid="test-todo-tag-urgent">urgent</li>
      <li class="tag">design</li>
    </ul>

    <!-- Expand/collapse toggle -->
    <button class="expand-toggle" data-testid="test-todo-expand-toggle" id="expandBtn">▼ Show details</button>
    <div id="collapsibleSection" data-testid="test-todo-collapsible-section" class="collapsible-section">
      <p><strong>Additional notes:</strong> Make sure to use semantic HTML.</p>
      <p><strong>Estimated time:</strong> 2 hours</p>
    </div>

    <div class="actions">
      <button class="edit-btn" data-testid="test-todo-edit-button">Edit</button>
      <button class="delete-btn" data-testid="test-todo-delete-button">Delete</button>
    </div>
  </div>

  <!-- Edit mode (hidden by default) -->
  <div id="editMode" class="edit-form hidden" data-testid="test-todo-edit-form">
    <div class="form-group">
      <label>Title</label>
      <input type="text" id="editTitle" data-testid="test-todo-edit-title-input" />
    </div>
    <div class="form-group">
      <label>Description</label>
      <textarea id="editDesc" data-testid="test-todo-edit-description-input" rows="2"></textarea>
    </div>
    <div class="form-group">
      <label>Due date (UTC)</label>
      <input type="datetime-local" id="editDueDate" data-testid="test-todo-edit-due-date-input" />
    </div>
    <div class="form-group">
      <label>Priority</label>
      <select id="editPriority" data-testid="test-todo-edit-priority-select">
        <option value="high">High</option>
        <option value="medium">Medium</option>
        <option value="low">Low</option>
      </select>
    </div>
    <div class="form-group">
      <label>Tags (comma separated)</label>
      <input type="text" id="editTags" placeholder="work, bug, feature" />
    </div>
    <div style="display: flex; gap: 10px;">
      <button class="save-btn" data-testid="test-todo-save-button">Save</button>
      <button class="cancel-btn" data-testid="test-todo-cancel-button">Cancel</button>
    </div>
  </div>
</article>

<script>
  (function(){
    // State
    let state = {
      title: 'Finish Mobile Stage 0 UI',
      description: 'Build accessible, responsive Todo Card component for Stage 0 evaluation.',
      dueDateISO: '2026-03-01T18:00:00Z',
      priority: 'high',
      tags: ['work', 'urgent', 'design'],
      completed: false
    };

    // DOM elements
    const viewMode = document.getElementById('viewMode');
    const editMode = document.getElementById('editMode');
    const titleEl = document.querySelector('[data-testid="test-todo-title"]');
    const descEl = document.querySelector('[data-testid="test-todo-description"]');
    const dueDateEl = document.querySelector('[data-testid="test-todo-due-date"]');
    const timeRemainingEl = document.getElementById('timeRemaining');
    const overdueEl = document.getElementById('overdueIndicator');
    const statusEl = document.querySelector('[data-testid="test-todo-status"]');
    const priorityBadge = document.querySelector('[data-testid="test-todo-priority-indicator"]');
    const tagsList = document.getElementById('tagsList');
    const checkbox = document.getElementById('complete');

    const editTitle = document.getElementById('editTitle');
    const editDesc = document.getElementById('editDesc');
    const editDueDate = document.getElementById('editDueDate');
    const editPriority = document.getElementById('editPriority');
    const editTags = document.getElementById('editTags');

    const expandBtn = document.getElementById('expandBtn');
    const collapsible = document.getElementById('collapsibleSection');

    // Expand/collapse toggle
    expandBtn.addEventListener('click', () => {
      const isHidden = collapsible.classList.toggle('hidden');
      expandBtn.textContent = isHidden ? '▶ Show details' : '▼ Hide details';
    });

    // Helper: format date
    function formatDisplay(iso) {
      const d = new Date(iso);
      return d.toLocaleString('en-US', { year:'numeric', month:'long', day:'numeric', hour:'numeric', minute:'2-digit', hour12: true, timeZone:'UTC' });
    }

    function isoToLocal(iso) {
      const d = new Date(iso);
      const year = d.getUTCFullYear();
      const month = String(d.getUTCMonth()+1).padStart(2,'0');
      const day = String(d.getUTCDate()).padStart(2,'0');
      const hours = String(d.getUTCHours()).padStart(2,'0');
      const minutes = String(d.getUTCMinutes()).padStart(2,'0');
      return `${year}-${month}-${day}T${hours}:${minutes}`;
    }

    function updateView() {
      titleEl.textContent = state.title;
      descEl.textContent = state.description;
      dueDateEl.textContent = `Due ${formatDisplay(state.dueDateISO)}`;
      dueDateEl.setAttribute('datetime', state.dueDateISO);
      priorityBadge.textContent = state.priority.charAt(0).toUpperCase() + state.priority.slice(1);
      priorityBadge.className = `badge priority-${state.priority}`;
      
      tagsList.innerHTML = '';
      state.tags.forEach(tag => {
        const li = document.createElement('li');
        li.className = 'tag';
        li.textContent = tag;
        if (tag === 'work') li.setAttribute('data-testid', 'test-todo-tag-work');
        if (tag === 'urgent') li.setAttribute('data-testid', 'test-todo-tag-urgent');
        tagsList.appendChild(li);
      });

      statusEl.textContent = state.completed ? 'Done' : 'Pending';
      checkbox.checked = state.completed;
      if (state.completed) titleEl.classList.add('strike');
      else titleEl.classList.remove('strike');

      updateTime();
    }

    function updateTime() {
      const due = new Date(state.dueDateISO);
      const now = new Date();
      const diff = due - now;
      const mins = Math.floor(diff/60000);
      const hrs = Math.floor(mins/60);
      const days = Math.floor(hrs/24);
      let text = '';
      if (diff <= 0) {
        const overdueHrs = Math.abs(hrs);
        if (overdueHrs < 1) text = 'Due now!';
        else text = `Overdue by ${overdueHrs} hour${overdueHrs!==1?'s':''}`;
        overdueEl.classList.remove('hidden');
      } else {
        if (days > 1) text = `Due in ${days} days`;
        else if (days === 1) text = 'Due tomorrow';
        else if (hrs > 0) text = `Due in ${hrs} hour${hrs!==1?'s':''}`;
        else text = `Due in ${mins} minute${mins!==1?'s':''}`;
        overdueEl.classList.add('hidden');
      }
      timeRemainingEl.textContent = text;
    }

    function populateEdit() {
      editTitle.value = state.title;
      editDesc.value = state.description;
      editDueDate.value = isoToLocal(state.dueDateISO);
      editPriority.value = state.priority;
      editTags.value = state.tags.join(', ');
    }

    function saveEdit() {
      const newTitle = editTitle.value.trim();
      if (!newTitle) return alert('Title required');
      state.title = newTitle;
      state.description = editDesc.value.trim();
      state.dueDateISO = editDueDate.value + ':00Z';
      state.priority = editPriority.value;
      const tagsInput = editTags.value.trim();
      state.tags = tagsInput ? tagsInput.split(',').map(t=>t.trim()).filter(t=>t) : ['untagged'];
      updateView();
      editMode.classList.add('hidden');
      viewMode.classList.remove('hidden');
    }

    // Event listeners
    document.querySelector('[data-testid="test-todo-edit-button"]').addEventListener('click', () => {
      populateEdit();
      viewMode.classList.add('hidden');
      editMode.classList.remove('hidden');
    });
    document.querySelector('[data-testid="test-todo-cancel-button"]').addEventListener('click', () => {
      editMode.classList.add('hidden');
      viewMode.classList.remove('hidden');
    });
    document.querySelector('[data-testid="test-todo-save-button"]').addEventListener('click', saveEdit);
    document.querySelector('[data-testid="test-todo-delete-button"]').addEventListener('click', () => alert('Delete clicked'));
    checkbox.addEventListener('change', e => {
      state.completed = e.target.checked;
      updateView();
    });

    // Initialize
    updateView();
    setInterval(updateTime, 60000);
  })();
</script>
</body>
</html>
