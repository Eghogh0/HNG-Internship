<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Profile Card · Stage 1b</title>
  <style>
    body {
      background: #f0f2f5;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      font-family: system-ui, sans-serif;
      margin: 0;
      padding: 16px;
    }
    .profile-card {
      background: white;
      border-radius: 24px;
      padding: 28px;
      max-width: 380px;
      width: 100%;
      box-shadow: 0 20px 35px rgba(0,0,0,0.05);
      text-align: center;
    }
    .avatar {
      width: 100px;
      height: 100px;
      border-radius: 50%;
      object-fit: cover;
      margin-bottom: 16px;
      border: 3px solid #e2e8f0;
    }
    .name {
      font-size: 1.8rem;
      font-weight: 700;
      margin: 8px 0 4px;
    }
    .bio {
      color: #4b5563;
      margin: 8px 0 16px;
      line-height: 1.5;
    }
    .time {
      background: #eef2ff;
      display: inline-block;
      padding: 6px 16px;
      border-radius: 40px;
      font-size: 0.9rem;
      margin-bottom: 20px;
    }
    .section-title {
      font-weight: 600;
      margin: 20px 0 8px;
      text-align: left;
    }
    .list {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      justify-content: center;
    }
    .chip {
      background: #f3f4f6;
      padding: 6px 14px;
      border-radius: 30px;
      font-size: 0.9rem;
    }
    .social-links {
      display: flex;
      justify-content: center;
      gap: 20px;
      margin-top: 16px;
    }
    .social-link {
      color: #4f46e5;
      text-decoration: none;
      font-weight: 500;
    }
  </style>
</head>
<body>
  <div class="profile-card" data-testid="test-profile-card">
    <img 
      src="https://i.pravatar.cc/150?img=7" 
      alt="User avatar" 
      class="avatar" 
      data-testid="test-user-avatar"
    />
    <h2 class="name" data-testid="test-user-name">Alex Johnson</h2>
    <p class="bio" data-testid="test-user-bio">Frontend developer passionate about accessibility and design systems.</p>
    
    <div class="time" data-testid="test-user-time">
      🕒 Local time: <span id="localTime"></span>
    </div>

    <div>
      <div class="section-title">🎯 Hobbies</div>
      <div class="list" data-testid="test-user-hobbies">
        <span class="chip">Hiking</span>
        <span class="chip">Chess</span>
        <span class="chip">Photography</span>
      </div>
    </div>

    <div>
      <div class="section-title">👎 Dislikes</div>
      <div class="list" data-testid="test-user-dislikes">
        <span class="chip">Traffic</span>
        <span class="chip">Pineapple on pizza</span>
        <span class="chip">Slow internet</span>
      </div>
    </div>

    <div class="social-links" data-testid="test-user-social-links">
      <a href="#" class="social-link">Twitter</a>
      <a href="#" class="social-link">GitHub</a>
      <a href="#" class="social-link">LinkedIn</a>
    </div>
  </div>

  <script>
    function updateLocalTime() {
      const now = new Date();
      const formatted = now.toLocaleTimeString('en-US', { hour: '2-digit', minute: '2-digit' });
      document.getElementById('localTime').textContent = formatted;
    }
    updateLocalTime();
    setInterval(updateLocalTime, 1000);
  </script>
</body>
</html>
