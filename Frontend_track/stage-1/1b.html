<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Profile Card · Stage 1b</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: system-ui, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background: linear-gradient(145deg, #f4f6fa 0%, #e9ecf2 100%);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .profile-card {
      max-width: 400px;
      width: 100%;
      background: #ffffff;
      border-radius: 28px;
      box-shadow: 0 20px 35px -5px rgba(0, 0, 0, 0.1), 0 8px 12px -4px rgba(0, 0, 0, 0.05);
      padding: 28px 24px 24px;
      transition: transform 0.2s ease;
    }

    .profile-header {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      margin-bottom: 22px;
    }

    .avatar-wrapper {
      margin-bottom: 16px;
    }

    .avatar {
      width: 110px;
      height: 110px;
      border-radius: 50%;
      object-fit: cover;
      border: 4px solid white;
      box-shadow: 0 6px 14px rgba(0, 0, 0, 0.08);
      background: #cbd5e1;
    }

    .name {
      font-size: 1.8rem;
      font-weight: 700;
      color: #0f172a;
      letter-spacing: -0.01em;
      margin-bottom: 4px;
    }

    .title {
      font-size: 1rem;
      color: #475569;
      font-weight: 500;
      margin-bottom: 12px;
    }

    .bio {
      font-size: 0.95rem;
      line-height: 1.5;
      color: #334155;
      padding: 0 8px;
      margin-bottom: 20px;
    }

    .stats {
      display: flex;
      justify-content: space-around;
      background: #f8fafc;
      padding: 14px 10px;
      border-radius: 24px;
      margin-bottom: 24px;
      border: 1px solid #e2e8f0;
    }

    .stat-item {
      text-align: center;
    }

    .stat-value {
      font-weight: 700;
      font-size: 1.3rem;
      color: #0f172a;
    }

    .stat-label {
      font-size: 0.8rem;
      color: #64748b;
      letter-spacing: 0.3px;
      text-transform: uppercase;
    }

    .social-links {
      display: flex;
      justify-content: center;
      gap: 20px;
      margin-bottom: 22px;
    }

    .social-link {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      background: #f1f5f9;
      padding: 8px;
      border-radius: 50%;
      transition: background 0.15s;
      color: #1e293b;
      text-decoration: none;
      width: 42px;
      height: 42px;
    }

    .social-link:hover {
      background: #e0e7ff;
      color: #4f46e5;
    }

    .social-link:focus-visible {
      outline: 3px solid #4f46e5;
      outline-offset: 2px;
    }

    .action-button {
      display: block;
      width: 100%;
      padding: 14px 10px;
      background: #4f46e5;
      color: white;
      font-weight: 600;
      font-size: 1rem;
      border: none;
      border-radius: 60px;
      cursor: pointer;
      transition: all 0.15s;
      box-shadow: 0 8px 16px -6px rgba(79, 70, 229, 0.3);
      border: 1px solid transparent;
    }

    .action-button:hover {
      background: #4338ca;
      transform: scale(1.01);
    }

    .action-button:focus-visible {
      outline: 3px solid #4f46e5;
      outline-offset: 3px;
    }

    .action-button.following {
      background: #f1f5f9;
      color: #1e293b;
      box-shadow: none;
      border-color: #cbd5e1;
    }

    /* Responsive */
    @media (max-width: 480px) {
      .profile-card {
        padding: 20px 16px;
      }
      .avatar {
        width: 96px;
        height: 96px;
      }
      .name {
        font-size: 1.6rem;
      }
    }
  </style>
</head>
<body>

<article class="profile-card" data-testid="profile-card" role="region" aria-label="User profile card">

  <!-- Header with avatar, name, title -->
  <header class="profile-header">
    <figure class="avatar-wrapper">
      <img 
        class="avatar" 
        src="https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=200&h=200&fit=crop&auto=format" 
        alt="Alex Morgan profile picture"
        data-testid="profile-avatar"
      />
    </figure>
    <h2 class="name" data-testid="profile-name">Alex Morgan</h2>
    <p class="title" data-testid="profile-title">Senior Product Designer</p>
  </header>

  <!-- Bio -->
  <p class="bio" data-testid="profile-bio">
    Designing inclusive digital experiences. Previously @DesignStudio. 
    Passionate about design systems and accessibility.
  </p>

  <!-- Stats: followers / following / projects -->
  <div class="stats" role="list" aria-label="Profile statistics">
    <div class="stat-item" role="listitem">
      <div class="stat-value" data-testid="profile-followers">2.4k</div>
      <div class="stat-label">Followers</div>
    </div>
    <div class="stat-item" role="listitem">
      <div class="stat-value" data-testid="profile-following">342</div>
      <div class="stat-label">Following</div>
    </div>
    <div class="stat-item" role="listitem">
      <div class="stat-value" data-testid="profile-projects">18</div>
      <div class="stat-label">Projects</div>
    </div>
  </div>

  <!-- Social links (with data-testid for each) -->
  <nav class="social-links" aria-label="Social media links">
    <a 
      href="#" 
      class="social-link" 
      data-testid="profile-social-twitter"
      aria-label="Twitter"
    >
      <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
        <path d="M18.244 2.25h3.308l-7.227 8.26 8.502 11.24H16.17l-5.214-6.817L4.99 21.75H1.68l7.73-8.835L1.254 2.25H8.08l4.713 6.231zm-1.161 17.52h1.833L7.084 4.126H5.117z"/>
      </svg>
    </a>
    <a 
      href="#" 
      class="social-link" 
      data-testid="profile-social-linkedin"
      aria-label="LinkedIn"
    >
      <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
        <path d="M20.447 20.452h-3.554v-5.569c0-1.328-.027-3.037-1.852-3.037-1.853 0-2.136 1.445-2.136 2.939v5.667H9.351V9h3.414v1.561h.046c.477-.9 1.637-1.85 3.37-1.85 3.601 0 4.267 2.37 4.267 5.455v6.286zM5.337 7.433c-1.144 0-2.063-.926-2.063-2.065 0-1.138.92-2.063 2.063-2.063 1.14 0 2.064.925 2.064 2.063 0 1.139-.925 2.065-2.064 2.065zm1.782 13.019H3.555V9h3.564v11.452zM22.225 0H1.771C.792 0 0 .774 0 1.729v20.542C0 23.227.792 24 1.771 24h20.451C23.2 24 24 23.227 24 22.271V1.729C24 .774 23.2 0 22.222 0h.003z"/>
      </svg>
    </a>
    <a 
      href="#" 
      class="social-link" 
      data-testid="profile-social-github"
      aria-label="GitHub"
    >
      <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
        <path d="M12 .297c-6.63 0-12 5.373-12 12 0 5.303 3.438 9.8 8.205 11.385.6.113.82-.258.82-.577 0-.285-.01-1.04-.015-2.04-3.338.724-4.042-1.61-4.042-1.61C4.422 18.07 3.633 17.7 3.633 17.7c-1.087-.744.084-.729.084-.729 1.205.084 1.838 1.236 1.838 1.236 1.07 1.835 2.809 1.305 3.495.998.108-.776.417-1.305.76-1.605-2.665-.3-5.466-1.332-5.466-5.93 0-1.31.465-2.38 1.235-3.22-.135-.303-.54-1.523.105-3.176 0 0 1.005-.322 3.3 1.23.96-.267 1.98-.399 3-.405 1.02.006 2.04.138 3 .405 2.28-1.552 3.285-1.23 3.285-1.23.645 1.653.24 2.873.12 3.176.765.84 1.23 1.91 1.23 3.22 0 4.61-2.805 5.625-5.475 5.92.42.36.81 1.096.81 2.22 0 1.606-.015 2.896-.015 3.286 0 .315.21.69.825.57C20.565 22.092 24 17.592 24 12.297c0-6.627-5.373-12-12-12"/>
      </svg>
    </a>
    <a 
      href="#" 
      class="social-link" 
      data-testid="profile-social-website"
      aria-label="Personal website"
    >
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <circle cx="12" cy="12" r="10"/>
        <line x1="2" y1="12" x2="22" y2="12"/>
        <path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/>
      </svg>
    </a>
  </nav>

  <!-- Follow / Unfollow button (with interactive state) -->
  <button 
    class="action-button" 
    data-testid="profile-follow-button"
    aria-pressed="false"
    id="followButton"
  >
    Follow
  </button>
</article>

<script>
  (function() {
    const followBtn = document.getElementById('followButton');
    let isFollowing = false;

    function updateButtonState() {
      if (isFollowing) {
        followBtn.textContent = 'Following';
        followBtn.classList.add('following');
        followBtn.setAttribute('aria-pressed', 'true');
      } else {
        followBtn.textContent = 'Follow';
        followBtn.classList.remove('following');
        followBtn.setAttribute('aria-pressed', 'false');
      }
    }

    followBtn.addEventListener('click', () => {
      isFollowing = !isFollowing;
      updateButtonState();
    });

    // Accessibility: if someone double-clicks etc.
    updateButtonState();
  })();
</script>

</body>
</html>
